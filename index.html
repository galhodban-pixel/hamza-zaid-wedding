<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>دعوة زفاف حمزة وزيد 💍</title>
<meta name="description" content="دعوة زفاف حمزة وزيد 💍 - نتشرف بحضوركم ومشاركتكم فرحتنا">
<meta property="og:title" content="دعوة زفاف حمزة وزيد 💍">
<meta property="og:description" content="نتشرف بحضوركم ومشاركتكم فرحتنا">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hamza-zaid-wedding.netlify.app/">
<meta name="theme-color" content="#0f0d0b">
<style>
:root{--bg:#0f0d0b;--panel:#17130f;--gold:#d9b56d;--gold2:#f2dfb0;--text:#f8f2e7;--muted:#d9ceb7;--line:rgba(217,181,109,.28);--shadow:0 14px 40px rgba(0,0,0,.32)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;scroll-behavior:smooth}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at top,rgba(217,181,109,.075),transparent 28%),var(--bg)}
.hero{width:100%;padding:6px 6px 0}
.video-wrap{position:relative;width:100%;max-width:520px;margin:0 auto;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
video{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#000;pointer-events:none}
.sound-float{position:absolute;top:14px;left:14px;z-index:8;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.58);color:#fff;border-radius:999px;padding:9px 13px;font-size:13px;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 5px 18px rgba(0,0,0,.25)}
.scroll-arrow{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:7;width:54px;height:54px;border-radius:999px;border:1px solid rgba(242,223,176,.34);background:rgba(12,10,8,.28);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--gold2);opacity:0;animation:arrowAppear .8s ease 2s forwards;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.scroll-arrow::before,.scroll-arrow::after{content:"";position:absolute;width:15px;height:15px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg)}
.scroll-arrow::before{top:12px;animation:arrowPulse 1.8s ease-in-out infinite}
.scroll-arrow::after{top:22px;opacity:.55;animation:arrowPulse 1.8s ease-in-out .18s infinite}
@keyframes arrowAppear{to{opacity:1}}
@keyframes arrowPulse{0%,100%{transform:translateY(-2px) rotate(45deg);opacity:.42}50%{transform:translateY(4px) rotate(45deg);opacity:1}}
.locations{width:100%;padding:8px 6px 22px;scroll-margin-top:6px}
.card{width:100%;max-width:520px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:22px;padding:22px 14px;box-shadow:var(--shadow)}
.title{color:var(--gold2);text-align:center;font-size:29px;margin:0 0 7px}
.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.75;margin:0 0 18px}
.loc{border:1px solid rgba(217,181,109,.20);background:rgba(255,255,255,.036);border-radius:18px;padding:17px 14px;margin-bottom:12px}
.loc h3{margin:0 0 7px;color:var(--gold2);font-size:21px}
.loc p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.7}
.btn{width:100%;border:1px solid var(--line);border-radius:13px;min-height:48px;padding:12px 14px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.primary{background:linear-gradient(180deg,#f0d08b,#d9b56d);color:#21170c}
.secondary{margin-top:4px;background:rgba(255,255,255,.045);color:var(--text)}
.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
@media(max-width:380px){.hero,.locations{padding-left:4px;padding-right:4px}.video-wrap,.card{border-radius:18px}.card{padding:19px 12px}.title{font-size:26px}.scroll-arrow{width:48px;height:48px;bottom:14px}}
</style>
</head>
<body>
<section class="hero" id="invitation">
  <div class="video-wrap">
    <video id="video" autoplay playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen">
      <source src="invite_web.mp4" type="video/mp4">
    </video>
    <button class="sound-float" id="sound" type="button">🔊 تشغيل الصوت</button>
    <a class="scroll-arrow" href="#locations" aria-label="انتقل إلى مواقع الحفل"></a>
  </div>
</section>
<section class="locations" id="locations">
  <div class="card">
    <h1 class="title">مواقع الحفل</h1>
    <p class="subtitle">اضغط على الموقع المطلوب لفتحه مباشرة في Google Maps</p>
    <div class="loc">
      <h3>📍 موقع الصالة</h3>
      <p>موقع قاعات الحفل.</p>
      <a class="btn primary" href="https://maps.app.goo.gl/VLUqps6evij3enRR8?g_st=ic" target="_blank" rel="noopener">فتح موقع الصالة</a>
    </div>
    <div class="loc">
      <h3>🏠 موقع باب البيت</h3>
      <p>موقع بيت والد العريسين.</p>
      <a class="btn primary" href="https://maps.app.goo.gl/gy4WJ1peDZB5sDdSA?g_st=ic" target="_blank" rel="noopener">فتح موقع باب البيت</a>
    </div>
    <a class="btn secondary" href="#invitation">الرجوع إلى الدعوة</a>
    <div class="footer">نتشرّف بحضوركم ومشاركتكم فرحتنا</div>
  </div>
</section>
<script>
const v=document.getElementById('video');
const s=document.getElementById('sound');
async function startVideo(){
  try{
    v.muted=false;v.volume=1;await v.play();s.style.display='none';
  }catch(e){
    v.muted=true;
    try{await v.play();}catch(_){}
    s.style.display='block';
  }
}
window.addEventListener('DOMContentLoaded',startVideo);
window.addEventListener('pageshow',startVideo);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&v.paused)startVideo();});
s.addEventListener('click',async()=>{v.muted=false;v.volume=1;try{await v.play();s.style.display='none';}catch(e){}});
document.addEventListener('pointerdown',()=>{if(v.muted){v.muted=false;v.volume=1;v.play().then(()=>s.style.display='none').catch(()=>{});}}, {once:true});
</script>
</body>
</html>
